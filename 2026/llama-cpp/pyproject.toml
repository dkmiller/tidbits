[project]
name = "llm"
version = "0.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cyclopts>=4.20.0",
    "jinja2",
    "openai",
    "python-frontmatter>=1.3.0",
    "PyYAML",
]
[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
llm = "llm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[workspace]
resolver = "3"
members = ["crates/game-core", "crates/game-app"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
bevy = { version = "0.20.1", default-features = false }
bevy_math = "0.20.1"
game-core = { path = "crates/game-core" }

# Bevy is very slow in unoptimized builds; optimize dependencies even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = "debuginfo"
